name: Test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        # Covers internal/resources too. The acceptance tests there self-skip
        # without TF_ACC and credentials, so this stays hermetic while gating the
        # resource-mapping unit tests.
        run: go test ./... -v -count=1
